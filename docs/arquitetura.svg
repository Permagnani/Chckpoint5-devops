<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E2E2E"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#FFFFFF"/>
  <text x="40" y="54" font-size="30" font-weight="700" fill="#2E2E2E">DimDim — Arquitetura da solução na Microsoft Azure</text>
  <text x="40" y="84" font-size="16" fill="#6B6B6B">Web App .NET 8 (PaaS) · Azure SQL Database (PaaS) · Application Insights · Deploy automatizado com GitHub Actions / Azure CLI</text>

  <!-- Usuário -->
  <g>
    <circle cx="110" cy="330" r="26" fill="#FFE600" stroke="#2E2E2E" stroke-width="2"/>
    <path d="M70,400 a40,36 0 0 1 80,0 z" fill="#FFE600" stroke="#2E2E2E" stroke-width="2"/>
    <text x="110" y="430" font-size="16" font-weight="600" text-anchor="middle" fill="#2E2E2E">Usuário</text>
    <text x="110" y="450" font-size="13" text-anchor="middle" fill="#6B6B6B">Navegador (HTTPS)</text>
  </g>

  <!-- Desenvolvedor / GitHub -->
  <g>
    <rect x="40" y="560" width="200" height="190" rx="14" fill="#F4F4F4" stroke="#2E2E2E" stroke-width="2"/>
    <circle cx="140" cy="608" r="26" fill="#2E2E2E"/>
    <text x="140" y="615" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">GH</text>
    <text x="140" y="660" font-size="16" font-weight="600" text-anchor="middle" fill="#2E2E2E">GitHub</text>
    <text x="140" y="682" font-size="13" text-anchor="middle" fill="#6B6B6B">Repositório + Actions</text>
    <text x="140" y="702" font-size="13" text-anchor="middle" fill="#6B6B6B">build → publish → deploy</text>
    <text x="140" y="728" font-size="12" text-anchor="middle" fill="#6B6B6B">(ou az webapp deploy)</text>
  </g>

  <!-- Azure subscription -->
  <rect x="320" y="120" width="1040" height="660" rx="18" fill="#EAF3FC" stroke="#0078D4" stroke-width="2.5"/>
  <text x="345" y="152" font-size="18" font-weight="700" fill="#0078D4">Assinatura Microsoft Azure</text>

  <!-- Resource group -->
  <rect x="350" y="170" width="980" height="580" rx="14" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="372" y="200" font-size="16" font-weight="600" fill="#0078D4">Resource Group: rg-dimdim (canadacentral)</text>

  <!-- App Service Plan + Web App -->
  <rect x="390" y="230" width="380" height="250" rx="12" fill="#F2F8FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="410" y="258" font-size="14" font-weight="600" fill="#0078D4">App Service Plan: plan-dimdim (Linux)</text>
  <rect x="420" y="280" width="320" height="175" rx="12" fill="#FFFFFF" stroke="#2E2E2E" stroke-width="2"/>
  <circle cx="470" cy="330" r="28" fill="#0078D4"/>
  <circle cx="460" cy="320" r="6" fill="#FFFFFF"/><circle cx="482" cy="340" r="6" fill="#FFFFFF"/><line x1="460" y1="320" x2="482" y2="340" stroke="#FFFFFF" stroke-width="3"/>
  <text x="515" y="322" font-size="17" font-weight="700" fill="#2E2E2E">Web App</text>
  <text x="515" y="344" font-size="13" fill="#6B6B6B">app-dimdim-&lt;RM&gt;</text>
  <text x="440" y="390" font-size="13" fill="#2E2E2E">ASP.NET Core MVC (.NET 8) + EF Core</text>
  <text x="440" y="410" font-size="13" fill="#2E2E2E">Front end: Clientes e Contas (CRUD)</text>
  <text x="440" y="430" font-size="13" fill="#2E2E2E">API REST: /api/clientes · /api/contas</text>

  <!-- Azure SQL -->
  <rect x="900" y="230" width="390" height="250" rx="12" fill="#F2F8FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="920" y="258" font-size="14" font-weight="600" fill="#0078D4">Azure SQL Server: sql-dimdim-&lt;RM&gt;</text>
  <rect x="930" y="280" width="330" height="175" rx="12" fill="#FFFFFF" stroke="#2E2E2E" stroke-width="2"/>
  <ellipse cx="980" cy="312" rx="26" ry="9" fill="#0078D4"/>
  <rect x="954" y="312" width="52" height="38" fill="#0078D4"/>
  <ellipse cx="980" cy="350" rx="26" ry="9" fill="#005A9E"/>
  <text x="1020" y="322" font-size="17" font-weight="700" fill="#2E2E2E">Azure SQL Database</text>
  <text x="1020" y="344" font-size="13" fill="#6B6B6B">db-dimdim (PaaS, Basic)</text>
  <text x="950" y="392" font-size="13" fill="#2E2E2E">dbo.Clientes (1) ── (N) dbo.Contas</text>
  <text x="950" y="412" font-size="13" fill="#2E2E2E">FK_Contas_Clientes · ON DELETE CASCADE</text>
  <text x="950" y="432" font-size="13" fill="#2E2E2E">Firewall: serviços Azure + IP do admin</text>

  <!-- Log Analytics + App Insights -->
  <rect x="390" y="540" width="900" height="180" rx="12" fill="#F7F2FF" stroke="#7A3EC8" stroke-width="1.5"/>
  <text x="410" y="568" font-size="14" font-weight="600" fill="#7A3EC8">Monitoramento</text>
  <rect x="420" y="585" width="400" height="115" rx="12" fill="#FFFFFF" stroke="#2E2E2E" stroke-width="2"/>
  <text x="440" y="618" font-size="17" font-weight="700" fill="#2E2E2E">Application Insights</text>
  <text x="440" y="640" font-size="13" fill="#6B6B6B">appi-dimdim</text>
  <text x="440" y="664" font-size="13" fill="#2E2E2E">requests · dependencies (SQL) · exceptions</text>
  <text x="440" y="684" font-size="13" fill="#2E2E2E">customEvents (ClienteCriado, ContaExcluida...)</text>
  <rect x="870" y="585" width="390" height="115" rx="12" fill="#FFFFFF" stroke="#2E2E2E" stroke-width="2"/>
  <text x="890" y="618" font-size="17" font-weight="700" fill="#2E2E2E">Log Analytics Workspace</text>
  <text x="890" y="640" font-size="13" fill="#6B6B6B">log-dimdim</text>
  <text x="890" y="664" font-size="13" fill="#2E2E2E">Armazena a telemetria do App Insights</text>
  <text x="890" y="684" font-size="13" fill="#2E2E2E">Consultas KQL (Logs)</text>

  <!-- Setas -->
  <line x1="160" y1="360" x2="415" y2="360" stroke="#2E2E2E" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="200" y="350" font-size="13" fill="#2E2E2E">HTTPS</text>

  <line x1="742" y1="368" x2="926" y2="368" stroke="#2E2E2E" stroke-width="2.5" marker-end="url(#seta)" marker-start="url(#seta)"/>
  <text x="772" y="356" font-size="13" fill="#2E2E2E">TDS 1433 (TLS)</text>
  <text x="772" y="392" font-size="12" fill="#6B6B6B">Connection String</text>
  <text x="772" y="408" font-size="12" fill="#6B6B6B">no App Service</text>

  <line x1="580" y1="456" x2="580" y2="582" stroke="#7A3EC8" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="590" y="525" font-size="13" fill="#7A3EC8">Telemetria (SDK)</text>

  <line x1="822" y1="642" x2="866" y2="642" stroke="#7A3EC8" stroke-width="2.5" marker-end="url(#seta)"/>

  <path d="M240,650 C320,650 330,470 418,440" fill="none" stroke="#2E2E2E" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta)"/>
  <text x="252" y="690" font-size="13" fill="#2E2E2E">Deploy</text>
  <text x="252" y="708" font-size="12" fill="#6B6B6B">Publish Profile</text>
</svg>
